name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - lint, typecheck, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo_secret
          POSTGRES_DB: peblo_tv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peblo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check app/ --ignore E501

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://peblo:peblo_secret@localhost:5432/peblo_tv_test
          SEED_ON_START: "false"
          JWT_SECRET_KEY: test-secret
          STORAGE_LOCAL_PATH: ./storage
        run: |
          pip install pytest pytest-asyncio httpx
          python -m pytest tests/ -x -v

  cms:
    name: CMS - lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  viewer:
    name: Viewer - lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, cms, viewer]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t peblo-api ./backend
      - name: Build CMS image
        run: docker build -t peblo-cms ./cms
      - name: Build Viewer image
        run: docker build -t peblo-viewer ./viewer

  deploy:
    name: Deploy (documented, no real cloud)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Simulate deploy
        run: |
          echo "In production, this job would:"
          echo "  1. Push images to a container registry (e.g. GitHub Container Registry)"
          echo "     docker push ghcr.io/org/peblo-api:latest"
          echo "  2. Trigger a deploy on the platform (Fly.io / Render / ECS / k8s)"
          echo "     fly deploy -i ghcr.io/org/peblo-api:latest"
          echo "  3. Run Alembic migrations against the production DB"
          echo "  4. Smoke-test /health and /catalog"
          echo "--- deploy simulated successfully ---"
