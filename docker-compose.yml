services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo_secret
      POSTGRES_DB: peblo_tv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo_tv"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://peblo:peblo_secret@db:5432/peblo_tv
      JWT_SECRET_KEY: dev-secret-key-change-me
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
      SEED_ON_START: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage

  cms:
    build: ./cms
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

  viewer:
    build: ./viewer
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3001:3001"

volumes:
  pgdata:
  storage_data:
